{% extends "base.html" %}
{% block title %}로그인 · NIKE 성적관리시스템{% endblock title %}

{% block style %}
<style>
    /* 로그인 화면 — 디자인: 김상민 */
    .login-wrapper {
        max-width: 400px;
        margin: 0 auto;
    }

    #login-form {
        border: 1px solid #f1f1f1;
        padding: 30px;
    }
</style>
{% endblock style %}

{% block content %}
<div class="login-wrapper">
    <h2 class="page_title">로그인</h2>
    <form method="post" action="{{ url_for('login') }}" id="login-form" class="shadow-sm">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <input type="text" class="form-control mb-2" id="login_id" name="login_id" placeholder="ID" required>
        <input type="password" class="form-control mb-2" id="password" name="password" placeholder="Password" required>
        <div class="form-check mb-3">
            <input type="checkbox" class="form-check-input" id="remember-check">
            <label class="form-check-label" for="remember-check">아이디 저장하기</label>
        </div>
        <button type="submit" class="btn btn-dark w-100">로그인</button>
    </form>
</div>
{% endblock content %}

{% block script %}
<script>
    // 아이디 저장하기: 이 브라우저에만 아이디를 기억함 (비밀번호는 저장하지 않음)
    var KEY = "saved_login_id";
    try {
        var saved = localStorage.getItem(KEY);
        if (saved) {
            $("#login_id").val(saved);
            $("#remember-check").prop("checked", true);
            $("#password").trigger("focus");
        } else {
            $("#login_id").trigger("focus");
        }
    } catch (e) { /* 저장소를 못 쓰는 브라우저면 그냥 넘어감 */ }

    $("#login-form").on("submit", function () {
        try {
            if ($("#remember-check").is(":checked")) localStorage.setItem(KEY, $("#login_id").val());
            else localStorage.removeItem(KEY);
        } catch (e) { }
    });
</script>
{% endblock script %}

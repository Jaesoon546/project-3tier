{% extends "base.html" %}
{% block title %}학교 등록{% endblock title %}
{% block content %}
<h2 class="page_title">학교 등록</h2>

<!-- 디자인: 김○민 school_insert.html — 표 한 줄에 입력칸을 두는 형태 -->
<form id="schoolForm" action="{{ url_for('school_insert') }}" method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <table class="table align-middle text-center">
        <thead class="table-light">
            <tr>
                <th>학교코드</th>
                <th>학교명</th>
                <th>주소</th>
                <th>홈페이지</th>
                <th></th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td><input class="form-control" id="schoolcode" name="schoolcode" maxlength="10" placeholder="예: DJ004" value="{{ form.schoolcode or '' }}" required></td>
                <td><input class="form-control" id="schoolname" name="schoolname" placeholder="학교명" value="{{ form.schoolname or '' }}" required></td>
                <td><input class="form-control" id="address" name="address" placeholder="주소" value="{{ form.address or '' }}"></td>
                <td><input class="form-control" type="url" id="homepage" name="homepage" maxlength="200" placeholder="http://... (선택)" value="{{ form.homepage or '' }}"></td>
                <td><button class="btn btn-dark text-nowrap" type="submit" id="insertBtn">등록</button></td>
            </tr>
        </tbody>
    </table>
</form>
<p class="text-secondary small">학생 수는 학생을 등록·삭제할 때 DB 트리거가 자동으로 계산합니다.
    홈페이지를 넣으면 학교 사진(static/images/schools/학교코드.jpg)을 눌렀을 때 그 주소로 이동합니다.</p>
{% endblock content %}
